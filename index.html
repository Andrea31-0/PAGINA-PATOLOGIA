    /* ==========================================================================
       ESTILOS COMPLEMENTARIOS PARA ANIMACIONES 3D, LLAVES SINÓPTICAS Y DETALLES
       ========================================================================== */
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    /* Tarjeta 3D Flip para Flashcards */
    .perspective-1200 {
      perspective: 1200px;
    }
    .preserve-3d {
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
    }
    .preserve-3d.flipped {
      transform: rotateY(180deg);
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* Animaciones suaves */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.24s ease-out forwards;
    }

    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .animate-shake {
      animation: shakeX 0.3s ease;
    }

    /* Scrollbar estilizada para barras horizontales */
    .thin-scroll::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .thin-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .thin-scroll::-webkit-scrollbar-thumb {

    }

    /* Contenedor de llave SVG sinóptica */
    .synoptic-brace-svg {
      width: 24px;
      flex-shrink: 0;
      overflow: visible;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          appState = { ...appState, ...JSON.parse(raw) };
        }
      } catch (e) {
        console.warn("Storage no disponible:", e);
      }
      if (appState.darkMode) {
        document.documentElement.classList.add("dark");
      }
      updateHeaderUI();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.warn("No se pudo guardar progreso:", e);
      }
      updateHeaderUI();
    }

    function updateHeaderUI() {
      document.getElementById("stat-xp").textContent = appState.xp;
      document.getElementById("stat-streak").textContent = appState.streak;
      const count = appState.masteredIds.length;
      document.getElementById("stat-mastered").textContent = `${count} / ${PATHOLOGIES.length}`;
      const pct = Math.round((count / PATHOLOGIES.length) * 100);
      document.getElementById("mastery-progress-fill").style.width = `${pct}%`;
      document.getElementById("btn-dark-mode").textContent = appState.darkMode ? "☀️" : "🌙";
    }

    function showToast(msg, color = "clinical") {
      const container = document.getElementById("toast-container");
      const el = document.createElement("div");
      const bgMap = {
        clinical: "bg-clinical-600 text-white",
        emerald: "bg-emerald-600 text-white",
        amber: "bg-amber-600 text-white",
        rose: "bg-rose-600 text-white"
      };
      el.className = `px-4 py-2 rounded-full text-xs font-bold shadow-lg animate-fade-in ${bgMap[color] || bgMap.clinical}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";
        el.style.transition = "opacity 0.25s ease";
        setTimeout(() => el.remove(), 260);
      }, 2200);
    }

    function addXP(pts, label = "") {
      appState.xp += pts;
      saveState();
      if (label) showToast(`+${pts} XP • ${label}`, "emerald");
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function normalizeChar(ch) {
      const upper = ch.toUpperCase();
      if (upper === "Ñ") return "Ñ";
      return upper.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function getFilteredPathologies() {
      if (appState.selectedCategory === "all") return PATHOLOGIES;
      return PATHOLOGIES.filter(p => p.category === appState.selectedCategory);
    }

       5. SISTEMA VISUAL DUAL: IMAGEN REAL (CON FALLBACK CANVAS) + ILUSTRACIÓN IA
       ========================================================================== */
    // Si una imagen externa falla o no hay red, genera una lámina clínica/Rx/H&E en Canvas
    function renderClinicalFallbackCanvas(imgEl, pathId) {
      if (imgEl.dataset.fallbackApplied === "true") return;
      imgEl.dataset.fallbackApplied = "true";

      const p = PATHOLOGIES.find(x => x.id === Number(pathId));
      const asset = VISUAL_ASSETS[pathId];
      const canvas = document.createElement("canvas");
      canvas.width = 640;
      canvas.height = 380;
      const ctx = canvas.getContext("2d");

      const type = asset ? asset.fallbackType : "clinical";

      if (type === "rx") {
        // Fondo película radiográfica dental de alto contraste
        const grad = ctx.createLinearGradient(0, 0, 640, 380);
        grad.addColorStop(0, "#0b1320");
        grad.addColorStop(0.5, "#172438");
        grad.addColorStop(1, "#090f1a");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 640, 380);

        // Trabeculado óseo sutil
        ctx.strokeStyle = "rgba(226, 232, 240, 0.08)";
        ctx.lineWidth = 1;
        for (let i = 0; i < 640; i += 18) {
          ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + 40, 380); ctx.stroke();
        }

        // Silueta de corona y raíces dentarias radiopacas
        ctx.fillStyle = "rgba(241, 245, 249, 0.85)";
        ctx.beginPath();
        ctx.roundRect(275, 55, 90, 75, 18);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(285, 130); ctx.lineTo(298, 225); ctx.lineTo(318, 135); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(322, 135); ctx.lineTo(342, 225); ctx.lineTo(355, 130); ctx.fill();

        // Área radiolúcida patológica con borde cortical
        ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.ellipse(320, 220, 88, 62, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.setLineDash([]);
      } else if (type === "histo") {
        // Fondo tinción Hematoxilina y Eosina (H&E)
        ctx.fillStyle = "#fce7f3";
        ctx.fillRect(0, 0, 640, 380);
        for (let i = 0; i < 45; i++) {
          ctx.fillStyle = i % 2 === 0 ? "rgba(134, 25, 143, 0.28)" : "rgba(244, 114, 182, 0.32)";
          ctx.beginPath();
          ctx.arc((i * 73) % 600 + 20, (i * 47) % 340 + 20, 12 + (i % 16), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.strokeStyle = "#86198f";
        ctx.lineWidth = 3;
        ctx.strokeRect(140, 85, 360, 190);
      } else {
        // Fondo mucosa oral clínica
        const grad = ctx.createRadialGradient(320, 190, 30, 320, 190, 340);
        grad.addColorStop(0, "#fda4af");
        grad.addColorStop(0.65, "#e11d48");
        grad.addColorStop(1, "#881337");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 640, 380);

        // Nódulo / placa clínica destacada
        ctx.fillStyle = "rgba(255, 241, 242, 0.88)";
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(320, 185, 95, 58, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      // Etiqueta clínica superior e inferior
      ctx.fillStyle = "rgba(15, 23, 42, 0.82)";
      ctx.fillRect(0, 0, 640, 42);
      ctx.fillStyle = "#38bdf8";
      ctx.font = "bold 14px Inter, sans-serif";
      ctx.fillText(`LÁMINA DE REFERENCIA • ${p ? p.name.toUpperCase() : "PATOLOGÍA BUCAL"}`, 18, 26);

      ctx.fillStyle = "rgba(15, 23, 42, 0.86)";
      ctx.fillRect(0, 326, 640, 54);
      ctx.fillStyle = "#f8fafc";
      ctx.font = "600 14px Inter, sans-serif";
      const label = asset ? asset.fallbackLabel : (p ? p.clinical.slice(0, 75) : "");
      ctx.fillText(label, 18, 358);

      imgEl.src = canvas.toDataURL("image/png");
    }

    // Llamada real a Gemini API para generar nuevas ilustraciones médicas bajo demanda
    async function generateAIImageForPathology(pathId, triggerContainerId = null) {
      const p = PATHOLOGIES.find(x => x.id === Number(pathId));
      if (!p) return;
      if (aiGeneratingState[pathId]) return;

      aiGeneratingState[pathId] = true;
      refreshCurrentViewAfterAI(triggerContainerId, pathId);

      const prompt = `Educational medical textbook diagram and clinical schematic of oral pathology: "${p.name}". Key features: ${p.clinical}. Location: ${p.location}. Radiographic/histologic detail: ${p.radiographic}. Clean vector medical illustration style, white background, clear anatomical focus, no messy text.`;

      const apiKey = "";
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite-image:generateContent?key=${apiKey}`;

      const delays = [1000, 2000, 4000];
      let success = false;

      for (let attempt = 0; attempt <= delays.length; attempt++) {
        try {
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseModalities: ["TEXT", "IMAGE"] }
            })
          });

          if (!response.ok) throw new Error("API status " + response.status);
          const result = await response.json();
          const base64Data = result?.candidates?.[0]?.content?.parts?.find(part => part.inlineData)?.inlineData?.data;

          if (base64Data) {
            aiGeneratedImagesCache[pathId] = `data:image/png;base64,${base64Data}`;
            success = true;
            showToast(`✨ Ilustración IA generada para ${p.name}`, "emerald");
            break;
          } else {
            throw new Error("No inlineData");
          }
        } catch (err) {
          if (attempt < delays.length) {
            await new Promise(res => setTimeout(res, delays[attempt]));
          }
        }
      }

      aiGeneratingState[pathId] = false;
      if (!success) {
        showToast("Se mantiene el esquema didáctico IA local", "amber");
      }
      refreshCurrentViewAfterAI(triggerContainerId, pathId);
    }

    function refreshCurrentViewAfterAI(triggerContainerId, pathId) {
      if (triggerContainerId === "visual-modal") {
        openVisualModal(pathId);
        return;
      }
      if (appState.activeTab === "guide") renderGuide();
      else if (appState.activeTab === "flashcards") renderFlashcards();
      else if (appState.activeTab === "maps") renderConceptMaps();
    }

          ? "bg-clinical-600 text-white border-clinical-600 shadow-sm"

    function resetCurrentModeForFilter() {
      const t = appState.activeTab;
      if (t === "quiz") startQuiz(quizSession.mode);
      else if (t === "hangman") initHangman();
      else if (t === "flashcards") initFlashcards();
      else if (t === "cases") initCases();
      else if (t === "match") initMatch();
      else if (t === "maps") renderConceptMaps();
      else if (t === "synoptic") {
        synopticSession.unitFilter = appState.selectedCategory;
        renderSynopticCharts();
      }
      else if (t === "guide") renderGuide();
    }

    function switchTab(tabName) {
      appState.activeTab = tabName;
      document.querySelectorAll(".mode-tab").forEach(btn => {
        const active = btn.dataset.tab === tabName;
        btn.className = active
          ? "mode-tab flex flex-col items-center justify-center gap-1 py-2.5 px-2 rounded-xl text-xs font-bold bg-clinical-600 text-white shadow-md transition"
          : "mode-tab flex flex-col items-center justify-center gap-1 py-2.5 px-2 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition";
      });

      if (tabName === "quiz") {
        if (!quizSession.questions.length) startQuiz("quick");

      } else if (tabName === "hangman") {
        if (!hangmanSession.pathology) initHangman();
        else renderHangman();
      } else if (tabName === "flashcards") {
        if (!fcSession.deck.length) initFlashcards();
        else renderFlashcards();
      } else if (tabName === "cases") {
        if (!caseSession.cases.length) initCases();
        else renderCases();
      } else if (tabName === "match") {
        if (!matchSession.pairs.length) initMatch();
        else renderMatch();
      } else if (tabName === "maps") {
        renderConceptMaps();
      } else if (tabName === "synoptic") {
        renderSynopticCharts();
      } else if (tabName === "guide") {
        renderGuide();

    /* ==========================================================================
       7. MODO 1: QUIZ TIPO EXAMEN (OPCIÓN MÚLTIPLE)
       ========================================================================== */
    function startQuiz(mode = "quick") {
      quizSession.mode = mode;
      let pool = appState.selectedCategory === "all"
        ? [...QUIZ_BANK]
        : QUIZ_BANK.filter(q => q.category === appState.selectedCategory);
      if (mode === "errors") pool = pool.filter(q => appState.wrongQuestionIds.includes(q.id));
      pool = shuffleArray(pool);
      const limit = mode === "quick" ? 10 : mode === "full" ? 25 : pool.length;
      quizSession = { mode, questions: pool.slice(0, limit), currentIndex: 0, score: 0, answered: false, selectedOption: null, finished: false };
      renderQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById("view-container");
      const errorCount = QUIZ_BANK.filter(q => appState.wrongQuestionIds.includes(q.id) && (appState.selectedCategory === "all" || q.category === appState.selectedCategory)).length;

      const modeBar = `
        <div class="flex flex-wrap gap-2 mb-4">
          <button onclick="startQuiz('quick')" class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${quizSession.mode === 'quick' ? 'bg-clinical-600 text-white border-clinical-600' : 'bg-slate-100 dark:bg-slate-800 border-slate-200 dark:border-slate-700'}">⚡ Ronda Rápida (10)</button>
          <button onclick="startQuiz('full')" class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${quizSession.mode === 'full' ? 'bg-clinical-600 text-white border-clinical-600' : 'bg-slate-100 dark:bg-slate-800 border-slate-200 dark:border-slate-700'}">🎓 Simulacro (25)</button>
          <button onclick="startQuiz('errors')" class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${quizSession.mode === 'errors' ? 'bg-rose-600 text-white border-rose-600' : 'bg-slate-100 dark:bg-slate-800 border-slate-200 dark:border-slate-700'}">🎯 Repasar Errores (${errorCount})</button>
        </div>
      `;

      if (!quizSession.questions.length) {
        container.innerHTML = `
          <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm">
            <h2 class="text-lg font-extrabold mb-3">📝 Quiz Tipo Examen</h2>
            ${modeBar}
            <div class="text-center py-8">
              <p class="font-bold text-base mb-2">${quizSession.mode === 'errors' ? '¡No tienes errores pendientes en esta unidad!' : 'No hay preguntas para este filtro.'}</p>
              <button onclick="startQuiz('quick')" class="mt-2 px-4 py-2 rounded-xl bg-clinical-600 text-white text-sm font-bold">Iniciar Ronda Rápida</button>
            </div>
          </div>`;
        return;
      }

      if (quizSession.finished) {
        const total = quizSession.questions.length;
        const pct = Math.round((quizSession.score / total) * 100);
        container.innerHTML = `
          <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-8 shadow-sm text-center animate-fade-in">
            <div class="text-5xl mb-3">${pct >= 70 ? "🏆" : "📖"}</div>
            <h2 class="text-2xl font-extrabold mb-1">Simulacro Completado</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mb-5">${pct >= 80 ? "¡Excelente dominio de los apuntes!" : "Repasa las explicaciones para asegurar el 10."}</p>
            <div class="flex justify-center gap-3 flex-wrap mb-6">
              <span class="px-4 py-2 rounded-full bg-clinical-100 dark:bg-cyan-950 text-clinical-700 dark:text-cyan-300 font-extrabold text-sm">Aciertos: ${quizSession.score}/${total} (${pct}%)</span>
              <span class="px-4 py-2 rounded-full bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 font-extrabold text-sm">Racha: 🔥 ${appState.streak}</span>
            </div>
            <button onclick="startQuiz('${quizSession.mode}')" class="px-5 py-2.5 rounded-xl bg-clinical-600 text-white text-sm font-bold shadow">🔄 Repetir Ronda</button>
          </div>`;
        return;
      }

      const q = quizSession.questions[quizSession.currentIndex];
      const pct = Math.round(((quizSession.currentIndex + (quizSession.answered ? 1 : 0)) / quizSession.questions.length) * 100);
      const letters = ["A", "B", "C", "D"];

      const optionsHTML = q.options.map((opt, idx) => {
        let style = "bg-slate-50 dark:bg-slate-800/70 border-slate-200 dark:border-slate-700 hover:border-clinical-500";
        if (quizSession.answered) {
          if (idx === q.correct) style = "bg-emerald-50 dark:bg-emerald-950/50 border-emerald-500 text-emerald-900 dark:text-emerald-200";
          else if (idx === quizSession.selectedOption) style = "bg-rose-50 dark:bg-rose-950/50 border-rose-500 text-rose-900 dark:text-rose-200";
        }
        return `
          <button onclick="answerQuiz(${idx})" ${quizSession.answered ? "disabled" : ""} class="w-full text-left p-3.5 rounded-xl border-2 font-semibold text-sm flex items-start gap-3 transition ${style}">
            <span class="w-7 h-7 rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 flex items-center justify-center font-extrabold text-xs shrink-0">${letters[idx]}</span>
            <span>${opt}</span>
          </button>`;
      }).join("");

      const isOk = quizSession.selectedOption === q.correct;

      container.innerHTML = `
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <h2 class="text-lg font-extrabold">📝 Quiz Tipo Examen</h2>
            <span class="px-3 py-1 rounded-full bg-clinical-100 dark:bg-cyan-950 text-clinical-700 dark:text-cyan-300 text-xs font-bold">Pregunta ${quizSession.currentIndex + 1} / ${quizSession.questions.length}</span>
          </div>
          ${modeBar}
          <div class="w-full h-2 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden mb-4">
            <div class="h-full bg-clinical-600 transition-all duration-300" style="width:${pct}%"></div>
          </div>
          <span class="inline-block px-2.5 py-0.5 rounded-full bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 text-xs font-bold mb-2">${q.category}</span>
          <p class="text-base sm:text-lg font-bold mb-4 leading-snug">${q.question}</p>
          <div class="space-y-2.5">${optionsHTML}</div>
          ${quizSession.answered ? `
            <div class="mt-4 p-4 rounded-xl border-l-4 animate-fade-in ${isOk ? 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-500' : 'bg-rose-50 dark:bg-rose-950/40 border-rose-500'}">
              <div class="font-extrabold text-sm mb-1">${isOk ? "✅ ¡Correcto! (+15 XP)" : "❌ Incorrecto — Dato clave:"}</div>
              <div class="text-xs sm:text-sm">${q.explanation}</div>
            </div>
            <div class="mt-4 flex justify-end">
              <button onclick="nextQuizQuestion()" class="px-5 py-2.5 rounded-xl bg-clinical-600 text-white text-sm font-bold shadow">
                ${quizSession.currentIndex + 1 < quizSession.questions.length ? "Siguiente ➡️" : "Ver Resultados 🏁"}
              </button>
            </div>
          ` : ""}
        </div>`;
    }

    function answerQuiz(idx) {
      if (quizSession.answered) return;
      const q = quizSession.questions[quizSession.currentIndex];
      quizSession.answered = true;
      quizSession.selectedOption = idx;
      if (idx === q.correct) {
        quizSession.score++;
        appState.streak++;
        appState.wrongQuestionIds = appState.wrongQuestionIds.filter(id => id !== q.id);
        addXP(15, "Acierto en Quiz");
      } else {
        appState.streak = 0;
        if (!appState.wrongQuestionIds.includes(q.id)) appState.wrongQuestionIds.push(q.id);
        saveState();
      }
      renderQuiz();
    }

    function nextQuizQuestion() {
      if (quizSession.currentIndex + 1 < quizSession.questions.length) {
        quizSession.currentIndex++;
        quizSession.answered = false;
        quizSession.selectedOption = null;
      } else {
        quizSession.finished = true;
      }
      renderQuiz();
    }

    /* ==========================================================================
       8. MODO 2: ADIVINA LA PALABRA (AHORCADO DIDÁCTICO)
       ========================================================================== */
    function initHangman() {
      const pool = getFilteredPathologies();
      hangmanSession = {
        pathology: pool[Math.floor(Math.random() * pool.length)],
        guessedLetters: [],
        wrongCount: 0,
        maxWrong: 6,
        hintsUnlocked: 1,
        status: "playing"
      };
      renderHangman();
    }

    function guessHangmanLetter(raw) {
      if (!hangmanSession.pathology || hangmanSession.status !== "playing") return;
      const norm = normalizeChar(raw);
      if (!/^[A-ZÑ]$/.test(norm) || hangmanSession.guessedLetters.includes(norm)) return;
      hangmanSession.guessedLetters.push(norm);

      const target = hangmanSession.pathology.hangmanWord.split("").map(c => normalizeChar(c));
      if (target.includes(norm)) {
        if (target.every(c => c === " " || hangmanSession.guessedLetters.includes(c))) {
          hangmanSession.status = "won";
          appState.streak++;
          addXP(25, "¡Patología adivinada!");
        }
      } else {
        hangmanSession.wrongCount++;
        if (hangmanSession.wrongCount >= hangmanSession.maxWrong) {
          hangmanSession.status = "lost";
          appState.streak = 0;
          saveState();
        }
      }
      renderHangman();
    }

    function renderHangman() {
      const container = document.getElementById("view-container");
      const p = hangmanSession.pathology;
      if (!p) return;

      const hearts = Array.from({ length: 6 }, (_, i) => `<span class="text-lg ${i < hangmanSession.wrongCount ? 'opacity-20 grayscale' : ''}">❤️</span>`).join("");

      const wordHTML = p.hangmanWord.split(" ").map(w => `
        <div class="flex flex-wrap justify-center gap-1.5">
          ${w.split("").map(ch => {
            const norm = normalizeChar(ch);
            const guessed = hangmanSession.guessedLetters.includes(norm);
            const show = guessed || hangmanSession.status !== "playing";
            const color = !guessed && hangmanSession.status === "lost" ? "text-rose-500 border-rose-500" : "text-clinical-700 dark:text-cyan-300 border-clinical-600";
            return `<div class="w-7 h-9 sm:w-8 sm:h-10 rounded-t-md border-b-4 bg-white dark:bg-slate-800 flex items-center justify-center font-extrabold text-base sm:text-lg shadow-sm ${color}">${show ? ch : ""}</div>`;
          }).join("")}
        </div>
      `).join("");

      const targetNorm = p.hangmanWord.split("").map(c => normalizeChar(c));
      const keysHTML = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("").map(l => {
        const used = hangmanSession.guessedLetters.includes(l);
        let cls = "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:border-clinical-500";
        if (used) cls = targetNorm.includes(l) ? "bg-emerald-600 text-white border-emerald-600" : "bg-slate-200 dark:bg-slate-800/40 text-slate-400 line-through opacity-40";
        return `<button onclick="guessHangmanLetter('${l}')" ${used || hangmanSession.status !== 'playing' ? "disabled" : ""} class="w-8 h-9 sm:w-9 sm:h-10 rounded-lg border font-extrabold text-xs sm:text-sm transition ${cls}">${l}</button>`;
      }).join("");

      container.innerHTML = `
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <h2 class="text-lg font-extrabold">🔤 Adivina la Patología</h2>
            <div class="flex items-center gap-1 text-xs font-bold">Vidas: ${hearts}</div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5 mb-5">
            <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs">
              <strong class="block text-clinical-600 dark:text-cyan-400 uppercase mb-1">🔓 Pista 1 • Localización</strong>
              <strong>${p.category}:</strong> ${p.location}
            </div>
            <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs ${hangmanSession.hintsUnlocked < 2 ? 'opacity-65 border-dashed' : ''}">
              <strong class="block text-clinical-600 dark:text-cyan-400 uppercase mb-1">${hangmanSession.hintsUnlocked >= 2 ? '🔓' : '🔒'} Pista 2 • Clínica / Rx</strong>
              ${hangmanSession.hintsUnlocked >= 2 ? `${p.clinical} <em>(Rx: ${p.radiographic})</em>` : "Desbloquea para ver clínica y radiografía."}
            </div>
            <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs ${hangmanSession.hintsUnlocked < 3 ? 'opacity-65 border-dashed' : ''}">
              <strong class="block text-clinical-600 dark:text-cyan-400 uppercase mb-1">${hangmanSession.hintsUnlocked >= 3 ? '🔓' : '🔒'} Pista 3 • Perla de Examen</strong>
              ${hangmanSession.hintsUnlocked >= 3 ? p.examTip : "Desbloquea el dato patognomónico."}
            </div>
          </div>

          <div class="flex flex-wrap justify-center gap-4 p-4 rounded-2xl bg-slate-100 dark:bg-slate-950/70 mb-5">${wordHTML}</div>

          ${hangmanSession.status !== "playing" ? `
            <div class="p-4 rounded-xl border-l-4 mb-5 animate-fade-in ${hangmanSession.status === 'won' ? 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-500' : 'bg-rose-50 dark:bg-rose-950/40 border-rose-500'}">
              <div class="font-extrabold text-sm mb-1">${hangmanSession.status === 'won' ? "🎉 ¡Acertaste! (+25 XP)" : `💡 Era: ${p.name}`}</div>
              <div class="text-xs sm:text-sm">${p.examTip} — <strong>Tx:</strong> ${p.treatment}</div>
            </div>
          ` : ""}

          <div class="flex flex-wrap justify-center gap-1.5 max-w-2xl mx-auto mb-5">${keysHTML}</div>

          <div class="flex flex-wrap justify-center gap-2">
            ${hangmanSession.status === "playing" && hangmanSession.hintsUnlocked < 3 ? `<button onclick="hangmanSession.hintsUnlocked++; renderHangman();" class="px-3.5 py-2 rounded-xl bg-amber-500 text-white text-xs font-bold">💡 Pista Extra (${hangmanSession.hintsUnlocked}/3)</button>` : ""}
            <button onclick="initHangman()" class="px-4 py-2 rounded-xl bg-clinical-600 text-white text-xs font-bold">🔄 Siguiente Patología</button>
          </div>
        </div>`;
    }

    /* ==========================================================================
       9. MODO 3: FLASHCARDS INTELIGENTES (CON IMÁGENES EN EL REVERSO)
       ========================================================================== */
    function initFlashcards() {
      fcSession = { deck: shuffleArray(getFilteredPathologies()), index: 0, flipped: false };
      renderFlashcards();
    }

    function rateFlashcard(rating) {
      const card = fcSession.deck[fcSession.index];
      if (!card) return;
      if (rating === "mastered") {
        if (!appState.masteredIds.includes(card.id)) {
          appState.masteredIds.push(card.id);
          addXP(15, `Dominado: ${card.name}`);
        } else {
          addXP(5, "Repasado");
        }
        fcSession.index++;
      } else if (rating === "doubt") {
        addXP(5, "Tarjeta repasada");
        fcSession.index++;
      } else {
        appState.masteredIds = appState.masteredIds.filter(id => id !== card.id);
        saveState();
        fcSession.deck.splice(Math.min(fcSession.index + 3, fcSession.deck.length), 0, card);
        fcSession.index++;
        showToast("Se repetirá en unas tarjetas más", "amber");
      }

      if (fcSession.index >= fcSession.deck.length) {
        fcSession.deck = shuffleArray(getFilteredPathologies());
        fcSession.index = 0;
        showToast("¡Mazo completado! Barajando de nuevo", "clinical");
      }
      fcSession.flipped = false;
      renderFlashcards();
    }

    function renderFlashcards() {
      const container = document.getElementById("view-container");
      const card = fcSession.deck[fcSession.index];
      if (!card) return;
      const isMastered = appState.masteredIds.includes(card.id);
      const hasVisual = !!VISUAL_ASSETS[card.id];

      container.innerHTML = `
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <h2 class="text-lg font-extrabold">🗂️ Flashcards de Recuerdo Activo</h2>
            <div class="flex items-center gap-2">
              <span class="px-3 py-1 rounded-full bg-clinical-100 dark:bg-cyan-950 text-clinical-700 dark:text-cyan-300 text-xs font-bold">Tarjeta ${fcSession.index + 1} / ${fcSession.deck.length}</span>
              ${isMastered ? '<span class="px-2.5 py-1 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300 text-xs font-bold">✅ Dominada</span>' : ""}
            </div>
          </div>

          <div class="perspective-1200 max-w-3xl mx-auto mb-5">
            <div id="fc-inner" onclick="fcSession.flipped = !fcSession.flipped; this.classList.toggle('flipped', fcSession.flipped);" class="preserve-3d relative w-full min-h-[340px] cursor-pointer ${fcSession.flipped ? 'flipped' : ''}">
              <!-- Frente -->
              <div class="backface-hidden absolute inset-0 rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-gradient-to-br from-white to-clinical-50 dark:from-slate-900 dark:to-slate-800 p-6 flex flex-col items-center justify-center text-center shadow-lg">
                <span class="px-3 py-1 rounded-full bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 text-xs font-bold mb-3">${card.category}</span>
                <h3 class="text-xl sm:text-2xl font-extrabold mb-3">${card.name}</h3>
                <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 max-w-md bg-white/80 dark:bg-slate-900/80 p-3 rounded-xl border border-slate-200 dark:border-slate-700">
                  Recuerda mentalmente: <strong>Etiología, localización, clínica, imagen Rx y tratamiento</strong> antes de voltear.
                </p>
                <span class="mt-5 text-xs font-bold text-clinical-600 dark:text-cyan-400">👆 Toca para voltear ${hasVisual ? "• Incluye imagen clínica/IA" : ""}</span>
              </div>

              <!-- Reverso -->
              <div class="backface-hidden rotate-y-180 relative min-h-[340px] rounded-2xl border-2 border-clinical-500 bg-white dark:bg-slate-900 p-5 shadow-lg">
                <div class="flex items-center justify-between gap-2 mb-3 pb-2 border-b border-slate-200 dark:border-slate-800">
                  <strong class="text-base font-extrabold text-clinical-600 dark:text-cyan-400">${card.name}</strong>
                  <span class="text-xs font-bold text-slate-400">Toca para volver</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">
                  <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800"><strong class="block text-clinical-600 dark:text-cyan-400 uppercase">🧬 Etiología</strong>${card.etiology}</div>
                  <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800"><strong class="block text-clinical-600 dark:text-cyan-400 uppercase">📍 Localización</strong>${card.location}</div>
                  <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800"><strong class="block text-clinical-600 dark:text-cyan-400 uppercase">🩺 Clínica</strong>${card.clinical}</div>
                  <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800"><strong class="block text-clinical-600 dark:text-cyan-400 uppercase">💊 Tratamiento</strong>${card.treatment}</div>
                </div>
                <div class="mt-2.5 p-2.5 rounded-xl bg-amber-50 dark:bg-amber-950/40 text-xs text-amber-900 dark:text-amber-200 font-semibold">
                  💡 <strong>Dato clave:</strong> ${card.examTip}
                </div>
                ${hasVisual ? buildVisualGalleryHTML(card.id, "flashcards") : ""}
              </div>
            </div>
          </div>

          <div class="flex flex-wrap justify-center gap-2.5">
            <button onclick="rateFlashcard('repeat')" class="px-4 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs sm:text-sm font-bold shadow">❌ Repetir</button>
            <button onclick="rateFlashcard('doubt')" class="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs sm:text-sm font-bold shadow">🤔 Lo dudé (+5 XP)</button>
            <button onclick="rateFlashcard('mastered')" class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold shadow">✅ ¡Dominado! (+15 XP)</button>
          </div>
        </div>`;
    }

    /* ==========================================================================
       10. MODO 4: CASOS CLÍNICOS
       ========================================================================== */
    function initCases() {
      const pool = appState.selectedCategory === "all" ? CLINICAL_CASES : CLINICAL_CASES.filter(c => c.category === appState.selectedCategory);
      caseSession = { cases: shuffleArray(pool.length ? pool : CLINICAL_CASES), index: 0, answered: false, selectedOption: null, score: 0 };
      renderCases();
    }

    function answerCase(idx) {
      if (caseSession.answered) return;
      const item = caseSession.cases[caseSession.index];
      caseSession.answered = true;
      caseSession.selectedOption = idx;
      if (idx === item.correct) {
        caseSession.score++;
        appState.streak++;
        addXP(20, "Diagnóstico clínico acertado");
      } else {
        appState.streak = 0;
        saveState();
      }
      renderCases();
    }

    function nextCase() {
      if (caseSession.index + 1 < caseSession.cases.length) {
        caseSession.index++;
        caseSession.answered = false;
        caseSession.selectedOption = null;
        renderCases();
      } else {
        initCases();
        showToast("¡Ronda de casos reiniciada!", "clinical");
      }
    }

    function renderCases() {
      const container = document.getElementById("view-container");
      const item = caseSession.cases[caseSession.index];
      if (!item) return;
      const letters = ["A", "B", "C", "D"];
      const isOk = caseSession.selectedOption === item.correct;

      container.innerHTML = `
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <h2 class="text-lg font-extrabold">🩺 Casos Clínicos</h2>
            <span class="px-3 py-1 rounded-full bg-clinical-100 dark:bg-cyan-950 text-clinical-700 dark:text-cyan-300 text-xs font-bold">Caso ${caseSession.index + 1} / ${caseSession.cases.length}</span>
          </div>

          <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/80 border-l-4 border-clinical-600 mb-4">
            <div class="text-xs font-extrabold uppercase text-clinical-600 dark:text-cyan-400 mb-1">📋 ${item.category} • 👤 ${item.patient}</div>
            <p class="text-sm sm:text-base font-semibold leading-relaxed">${item.presentation}</p>
          </div>

          <div class="space-y-2.5">
            ${item.options.map((opt, idx) => {
              let cls = "bg-slate-50 dark:bg-slate-800/70 border-slate-200 dark:border-slate-700 hover:border-clinical-500";
              if (caseSession.answered) {
                if (idx === item.correct) cls = "bg-emerald-50 dark:bg-emerald-950/50 border-emerald-500 text-emerald-900 dark:text-emerald-200";
                else if (idx === caseSession.selectedOption) cls = "bg-rose-50 dark:bg-rose-950/50 border-rose-500 text-rose-900 dark:text-rose-200";
              }
              return `<button onclick="answerCase(${idx})" ${caseSession.answered ? "disabled" : ""} class="w-full text-left p-3.5 rounded-xl border-2 font-semibold text-sm flex items-center gap-3 transition ${cls}">
                <span class="w-7 h-7 rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 flex items-center justify-center font-extrabold text-xs">${letters[idx]}</span>
                <span>${opt}</span>
              </button>`;
            }).join("")}
          </div>

          ${caseSession.answered ? `
            <div class="mt-4 p-4 rounded-xl border-l-4 animate-fade-in ${isOk ? 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-500' : 'bg-rose-50 dark:bg-rose-950/40 border-rose-500'}">
              <div class="font-extrabold text-sm mb-1">${isOk ? "✅ ¡Diagnóstico Certero! (+20 XP)" : "⚠️ Revisa la pista clínica"}</div>
              <div class="text-xs sm:text-sm"><strong>Clave diagnóstica:</strong> ${item.clue}</div>
            </div>
            <div class="mt-4 flex justify-end">
              <button onclick="nextCase()" class="px-5 py-2.5 rounded-xl bg-clinical-600 text-white text-sm font-bold shadow">Siguiente Caso ➡️</button>
            </div>
          ` : ""}
        </div>`;
    }

    /* ==========================================================================
       11. MODO 5: CONECTA PARES (EMPAREJAMIENTO)
       ========================================================================== */
    function initMatch() {
      const selected = shuffleArray(getFilteredPathologies()).slice(0, 6);
      matchSession = {
        pairs: selected,
        leftItems: shuffleArray(selected.map(p => ({ id: p.id, text: p.name }))),
        rightItems: shuffleArray(selected.map(p => ({ id: p.id, text: p.examTip }))),
        selectedLeft: null,
        selectedRight: null,
        matchedIds: [],
        errorIds: [],
        moves: 0
      };
      renderMatch();
    }

    function selectMatchTile(side, id) {
      if (matchSession.matchedIds.includes(id)) return;
      if (side === "left") matchSession.selectedLeft = matchSession.selectedLeft === id ? null : id;
      else matchSession.selectedRight = matchSession.selectedRight === id ? null : id;

      if (matchSession.selectedLeft !== null && matchSession.selectedRight !== null) {
        matchSession.moves++;
        if (matchSession.selectedLeft === matchSession.selectedRight) {
          matchSession.matchedIds.push(matchSession.selectedLeft);
          matchSession.selectedLeft = null;
          matchSession.selectedRight = null;
          if (matchSession.matchedIds.length === matchSession.pairs.length) {
            appState.streak++;
            addXP(20, "¡Parejas completadas!");
          }
        } else {
          matchSession.errorIds = [matchSession.selectedLeft, matchSession.selectedRight];
          renderMatch();
          setTimeout(() => {
            matchSession.selectedLeft = null;
            matchSession.selectedRight = null;
            matchSession.errorIds = [];
            renderMatch();
          }, 400);
          return;
        }
      }
      renderMatch();
    }

    function renderMatch() {
      const container = document.getElementById("view-container");
      const done = matchSession.matchedIds.length === matchSession.pairs.length;

      container.innerHTML = `
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <h2 class="text-lg font-extrabold">🔗 Conecta Conceptos</h2>
            <div class="flex items-center gap-2">
              <span class="px-3 py-1 rounded-full bg-clinical-100 dark:bg-cyan-950 text-clinical-700 dark:text-cyan-300 text-xs font-bold">${matchSession.matchedIds.length} / ${matchSession.pairs.length}</span>
              <button onclick="initMatch()" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold border border-slate-200 dark:border-slate-700">🔄 Nuevas</button>
            </div>
          </div>

          ${done ? `
            <div class="p-4 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-400 mb-4 flex items-center justify-between flex-wrap gap-2">
              <span class="font-bold text-sm text-emerald-900 dark:text-emerald-200">🎉 ¡Completado en ${matchSession.moves} intentos! (+20 XP)</span>
              <button onclick="initMatch()" class="px-4 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-bold">Siguiente Ronda ➡️</button>
            </div>
          ` : ""}

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="space-y-2">
              <div class="text-xs font-extrabold uppercase text-slate-400">Patología / Síndrome</div>
              ${matchSession.leftItems.map(item => {
                const m = matchSession.matchedIds.includes(item.id);
                const s = matchSession.selectedLeft === item.id;
                const e = matchSession.errorIds[0] === item.id;
                const cls = m ? "bg-emerald-50 dark:bg-emerald-950/40 border-emerald-500 text-emerald-800 dark:text-emerald-300 opacity-75" : s ? "bg-clinical-100 dark:bg-cyan-950 border-clinical-600 text-clinical-800 dark:text-cyan-200" : e ? "bg-rose-100 border-rose-500 animate-shake" : "bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700";
                return `<button onclick="selectMatchTile('left', ${item.id})" ${m ? "disabled" : ""} class="w-full text-left p-3 rounded-xl border-2 text-xs sm:text-sm font-bold min-h-[52px] transition ${cls}">${m ? "✅ " : ""}${item.text}</button>`;
              }).join("")}
            </div>
            <div class="space-y-2">
              <div class="text-xs font-extrabold uppercase text-slate-400">Dato Clave / Signo Rx / Apodo</div>
              ${matchSession.rightItems.map(item => {
                const m = matchSession.matchedIds.includes(item.id);
                const s = matchSession.selectedRight === item.id;
                const e = matchSession.errorIds[1] === item.id;
                const cls = m ? "bg-emerald-50 dark:bg-emerald-950/40 border-emerald-500 text-emerald-800 dark:text-emerald-300 opacity-75" : s ? "bg-clinical-100 dark:bg-cyan-950 border-clinical-600 text-clinical-800 dark:text-cyan-200" : e ? "bg-rose-100 border-rose-500 animate-shake" : "bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700";
                return `<button onclick="selectMatchTile('right', ${item.id})" ${m ? "disabled" : ""} class="w-full text-left p-3 rounded-xl border-2 text-xs font-semibold min-h-[52px] transition ${cls}">${item.text}</button>`;
              }).join("")}
            </div>
          </div>
        </div>`;
    }

    /* ==========================================================================
       12. MODO 6: MAPAS CONCEPTUALES INTERACTIVOS (CON PALABRAS DE ENLACE Y FICHA)
       ========================================================================== */
    function selectConceptMap(mapId) {
      mapSession.selectedMapId = mapId;
      const mapObj = CONCEPT_MAPS.find(m => m.id === mapId);
      if (mapObj && mapObj.branches[0] && mapObj.branches[0].nodes[0]) {
        mapSession.selectedNodeId = mapObj.branches[0].nodes[0].id;
      }
      renderConceptMaps();
    }

    function selectConceptNode(pathId) {
      mapSession.selectedNodeId = Number(pathId);
      renderConceptMaps();
    }

    function renderConceptMaps() {
      const container = document.getElementById("view-container");
      const activeMap = CONCEPT_MAPS.find(m => m.id === mapSession.selectedMapId) || CONCEPT_MAPS[0];
      const selectedPathology = PATHOLOGIES.find(p => p.id === mapSession.selectedNodeId) || PATHOLOGIES[0];

      const selectorPills = CONCEPT_MAPS.map(m => {
        const isSel = m.id === activeMap.id;
        return `<button onclick="selectConceptMap('${m.id}')" class="px-3.5 py-2 rounded-xl text-xs font-bold border transition ${isSel ? 'bg-clinical-600 text-white border-clinical-600 shadow' : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-clinical-500'}">${m.title}</button>`;
      }).join("");

      const branchesHTML = activeMap.branches.map(br => `
        <div class="flex flex-col items-center bg-slate-50/80 dark:bg-slate-800/50 rounded-2xl border border-slate-200 dark:border-slate-700 p-3.5 relative">
          <!-- Conector superior -->
          <div class="w-0.5 h-4 bg-clinical-400 dark:bg-cyan-600 -mt-5 mb-1"></div>
          <!-- Nodo Subcategoría -->
          <div class="w-full text-center px-3 py-2 rounded-xl bg-clinical-600 text-white font-extrabold text-xs shadow-sm">
            ${br.title}
          </div>
          <!-- Palabra de enlace -->
          <div class="my-2 px-2.5 py-0.5 rounded-full bg-amber-100 dark:bg-amber-950/70 text-amber-800 dark:text-amber-300 border border-amber-300/60 dark:border-amber-700/60 text-[11px] font-semibold italic">
            ↓ ${br.link} ↓
          </div>
          <!-- Nodos Hoja (Patologías clicables) -->
          <div class="w-full space-y-2">
            ${br.nodes.map(node => {
              const isSelected = node.id === selectedPathology.id;
              const hasImg = !!VISUAL_ASSETS[node.id];
              return `
                <button onclick="selectConceptNode(${node.id})" class="w-full text-left p-2.5 rounded-xl border-2 transition flex flex-col gap-1 ${isSelected ? 'bg-emerald-50 dark:bg-emerald-950/50 border-emerald-500 shadow-sm' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 hover:border-clinical-500'}">
                  <div class="flex items-center justify-between gap-1">
                    <span class="text-xs font-extrabold text-slate-900 dark:text-white">${node.label}</span>
                    ${hasImg ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-clinical-100 dark:bg-cyan-950 text-clinical-700 dark:text-cyan-300 font-bold shrink-0">🖼️ Visual</span>' : ''}
                  </div>
                  <span class="text-[11px] font-medium text-slate-500 dark:text-slate-400">${node.tag}</span>
                </button>
              `;
            }).join("")}
          </div>
        </div>
      `).join("");

      container.innerHTML = `
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div>
              <h2 class="text-lg font-extrabold">🗺️ Mapas Conceptuales Interactivos</h2>
              <p class="text-xs text-slate-500 dark:text-slate-400">Explora las relaciones jerárquicas con palabras de enlace y haz clic en cualquier nodo para inspeccionar su ficha clínica e imágenes.</p>
            </div>
          </div>

          <div class="flex flex-wrap gap-2 mb-5">${selectorPills}</div>

          <!-- Lienzo del Mapa Conceptual -->
          <div class="p-4 sm:p-5 rounded-2xl bg-slate-100/70 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-800 mb-6">
            <!-- Nodo Raíz Central -->
            <div class="flex flex-col items-center mb-4">
              <div class="px-6 py-3 rounded-2xl bg-gradient-to-r from-clinical-700 to-emerald-700 text-white font-extrabold text-sm sm:text-base shadow-md text-center">
                ${activeMap.root}
              </div>
              <div class="w-0.5 h-3 bg-clinical-500"></div>
              <div class="px-3 py-0.5 rounded-full bg-white dark:bg-slate-800 border border-clinical-300 dark:border-cyan-700 text-clinical-700 dark:text-cyan-300 text-xs font-bold italic shadow-sm">
                ${activeMap.linkWord}
              </div>
              <div class="w-0.5 h-3 bg-clinical-500"></div>
              <div class="w-3/4 h-0.5 bg-clinical-400 dark:bg-cyan-700"></div>
            </div>

            <!-- Ramas del Mapa -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-${Math.min(activeMap.branches.length, 4)} gap-4 pt-2">
              ${branchesHTML}
            </div>
          </div>

          <!-- Ficha Clínica del Nodo Seleccionado -->
          <div class="rounded-2xl border-2 border-emerald-500/60 bg-emerald-50/30 dark:bg-slate-800/60 p-4 sm:p-5 animate-fade-in">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div>
                <span class="text-[11px] font-extrabold uppercase tracking-wider text-emerald-700 dark:text-emerald-300">Nodo Seleccionado • ${selectedPathology.category}</span>
                <h3 class="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white">${selectedPathology.id}. ${selectedPathology.name}</h3>
              </div>
              <button onclick="openVisualModal(${selectedPathology.id})" class="px-3 py-1.5 rounded-xl bg-clinical-600 text-white text-xs font-bold shadow-sm">
                🔍 Ampliar Ficha
              </button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5 text-xs">
              <div class="p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700">
                <strong class="block text-clinical-600 dark:text-cyan-400 uppercase mb-0.5">🧬 Etiología</strong>${selectedPathology.etiology}
              </div>
              <div class="p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700">
                <strong class="block text-clinical-600 dark:text-cyan-400 uppercase mb-0.5">📍 Localización</strong>${selectedPathology.location}
              </div>
              <div class="p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700">
                <strong class="block text-clinical-600 dark:text-cyan-400 uppercase mb-0.5">🩺 Clínica / Rx</strong>${selectedPathology.clinical} <em>(Rx: ${selectedPathology.radiographic})</em>
              </div>
              <div class="p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700">
                <strong class="block text-clinical-600 dark:text-cyan-400 uppercase mb-0.5">💊 Tratamiento</strong>${selectedPathology.treatment}
              </div>
            </div>
            ${buildVisualGalleryHTML(selectedPathology.id, "maps")}
          </div>
        </div>`;
    }

    /* ==========================================================================
       13. MODO 7: CUADROS SINÓPTICOS INTERACTIVOS CON LLAVES SVG { ESCALABLES
       ========================================================================== */
    function toggleSynopticKey(key) {
      if (synopticSession.collapsedKeys.includes(key)) {
        synopticSession.collapsedKeys = synopticSession.collapsedKeys.filter(k => k !== key);
      } else {
        synopticSession.collapsedKeys.push(key);
      }
      renderSynopticCharts();
    }

    function expandAllSynoptic() {
      synopticSession.collapsedKeys = [];
      renderSynopticCharts();
    }

    function collapseAllSynoptic() {
      const catKeys = CATEGORIES.filter(c => c.id !== "all").map(c => "cat:" + c.id);
      const pathKeys = PATHOLOGIES.map(p => "path:" + p.id);
      synopticSession.collapsedKeys = [...catKeys, ...pathKeys];
      renderSynopticCharts();
    }

    // Dibuja auténticas llaves sinópticas curvas { en SVG ajustadas a la altura real de cada bloque
    function drawSynopticCurlyBraces() {
      document.querySelectorAll("[data-brace-container]").forEach(wrapper => {
        const svg = wrapper.querySelector("svg.synoptic-brace-svg");
        const content = wrapper.querySelector("[data-brace-content]");
        if (!svg || !content) return;
        const h = Math.max(content.offsetHeight, 36);
        svg.setAttribute("viewBox", `0 0 24 ${h}`);
        svg.style.height = `${h}px`;
        const mid = h / 2;
        const r = Math.min(10, h / 4);
        // Trazo SVG clásico de llave izquierda {
        const d = `M 20 2 Q 11 2 11 ${2 + r} L 11 ${mid - r} Q 11 ${mid} 3 ${mid} Q 11 ${mid} 11 ${mid + r} L 11 ${h - 2 - r} Q 11 ${h - 2} 20 ${h - 2}`;
        svg.innerHTML = `<path d="${d}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>`;
      });
    }

    function renderSynopticCharts() {
      const container = document.getElementById("view-container");
      const activeCat = synopticSession.unitFilter === "all" ? appState.selectedCategory : synopticSession.unitFilter;
      const catsToShow = CATEGORIES.filter(c => c.id !== "all" && (activeCat === "all" || c.id === activeCat));

      const unitButtons = CATEGORIES.map(c => {
        const sel = activeCat === c.id;
        return `<button onclick="synopticSession.unitFilter='${c.id}'; renderSynopticCharts();" class="px-3 py-1.5 rounded-full text-xs font-bold border transition ${sel ? 'bg-clinical-600 text-white border-clinical-600' : 'bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'}">${c.name}</button>`;
      }).join("");

      const treeHTML = catsToShow.map(cat => {
        const catKey = "cat:" + cat.id;
        const catCollapsed = synopticSession.collapsedKeys.includes(catKey);
        const items = PATHOLOGIES.filter(p => p.category === cat.id);

        return `
          <div class="flex items-stretch my-2">
            <!-- Nodo Categoría (Nivel 2) -->
            <div class="flex items-center shrink-0">
              <button onclick="toggleSynopticKey('${catKey}')" class="w-44 sm:w-52 text-left px-3.5 py-2.5 rounded-xl bg-clinical-600 hover:bg-clinical-500 text-white font-extrabold text-xs shadow-sm flex items-center justify-between gap-2 transition">
                <span>${cat.name}</span>
                <span class="text-[11px] bg-white/20 px-1.5 py-0.5 rounded">${catCollapsed ? "+" : "−"}</span>
              </button>
            </div>

            ${!catCollapsed ? `
              <div data-brace-container class="flex items-stretch flex-1">
                <svg class="synoptic-brace-svg text-clinical-600 dark:text-cyan-400 mx-1"></svg>
                <div data-brace-content class="flex flex-col justify-center gap-2.5 py-1 flex-1">
                  ${items.map(p => {
                    const pKey = "path:" + p.id;
                    const pCollapsed = synopticSession.collapsedKeys.includes(pKey);
                    const hasVisual = !!VISUAL_ASSETS[p.id];
                    const alertBadges = p.alerts.map(a => {
                      if (a === "alta-recidiva") return `<span class="px-1.5 py-0.5 rounded bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 text-[10px] font-bold">⚠️ Recidiva</span>`;
                      if (a === "maligno") return `<span class="px-1.5 py-0.5 rounded bg-rose-100 dark:bg-rose-950 text-rose-800 dark:text-rose-300 text-[10px] font-bold">🚨 Maligno</span>`;
                      if (a === "signo-rx") return `<span class="px-1.5 py-0.5 rounded bg-cyan-100 dark:bg-cyan-950 text-cyan-800 dark:text-cyan-300 text-[10px] font-bold">🩻 Rx</span>`;
                      return "";
                    }).join("");

                    return `
                      <div class="flex items-stretch">
                        <!-- Nodo Entidad (Nivel 3) -->
                        <div class="flex items-center shrink-0">
                          <div class="w-52 sm:w-64 p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col gap-1">
                            <div class="flex items-start justify-between gap-1">
                              <button onclick="toggleSynopticKey('${pKey}')" class="text-left text-xs font-extrabold text-slate-900 dark:text-white hover:text-clinical-600 dark:hover:text-cyan-400">
                                ${p.id}. ${p.name}
                              </button>
                              <button onclick="toggleSynopticKey('${pKey}')" class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-700 font-bold shrink-0">
                                ${pCollapsed ? "+" : "−"}
                              </button>
                            </div>
                            <div class="flex flex-wrap items-center gap-1">
                              ${alertBadges}
                              <button onclick="openVisualModal(${p.id})" class="px-1.5 py-0.5 rounded bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300 text-[10px] font-bold hover:underline">
                                ${hasVisual ? "🖼️ Ver lámina" : "✨ Ver ficha"}
                              </button>
                            </div>
                          </div>
                        </div>

                        ${!pCollapsed ? `
                          <!-- Sub-llave de Síntesis (Nivel 4) -->
                          <div data-brace-container class="flex items-stretch flex-1">
                            <svg class="synoptic-brace-svg text-emerald-600 dark:text-emerald-400 mx-1"></svg>
                            <div data-brace-content class="flex flex-col justify-center gap-1 py-0.5 text-[11px] text-slate-700 dark:text-slate-300 min-w-[260px]">
                              <div class="px-2.5 py-1 rounded-lg bg-slate-50 dark:bg-slate-800/70 border border-slate-200/80 dark:border-slate-700/80">
                                <strong class="text-clinical-700 dark:text-cyan-300">Etiología:</strong> ${p.etiology}
                              </div>
                              <div class="px-2.5 py-1 rounded-lg bg-slate-50 dark:bg-slate-800/70 border border-slate-200/80 dark:border-slate-700/80">
                                <strong class="text-clinical-700 dark:text-cyan-300">Clínica y Sitio:</strong> ${p.location} — ${p.clinical}
                              </div>
                              <div class="px-2.5 py-1 rounded-lg bg-slate-50 dark:bg-slate-800/70 border border-slate-200/80 dark:border-slate-700/80">
                                <strong class="text-emerald-700 dark:text-emerald-300">Rx y Tx:</strong> ${p.radiographic} | <strong>Tx:</strong> ${p.treatment}
                              </div>
                            </div>
                          </div>
                        ` : ""}
                      </div>
                    `;
                  }).join("")}
                </div>
              </div>
            ` : ""}
          </div>
        `;
      }).join("");

      container.innerHTML = `
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div>
              <h2 class="text-lg font-extrabold">🌿 Cuadros Sinópticos Jerárquicos</h2>
              <p class="text-xs text-slate-500 dark:text-slate-400">Estructura clásica de llaves de izquierda a derecha. Haz clic en cualquier rama para expandir/colapsar o en <strong>🖼️ Ver lámina</strong> para inspeccionar imágenes.</p>
            </div>
            <div class="flex gap-2">
              <button onclick="expandAllSynoptic()" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold border border-slate-200 dark:border-slate-700">➕ Expandir Todo</button>
              <button onclick="collapseAllSynoptic()" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold border border-slate-200 dark:border-slate-700">➖ Colapsar Todo</button>
            </div>
          </div>

          <div class="flex gap-2 overflow-x-auto pb-2 mb-4 thin-scroll">${unitButtons}</div>

          <!-- Lienzo horizontal desplazable del Cuadro Sinóptico -->
          <div class="overflow-x-auto pb-4 thin-scroll rounded-2xl bg-slate-100/60 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-800 p-4">
            <div class="inline-flex items-stretch min-w-max">
              <!-- Tronco Principal (Nivel 1) -->
              <div class="flex items-center shrink-0">
                <div class="px-4 py-3 rounded-2xl bg-gradient-to-b from-clinical-700 to-emerald-700 text-white font-extrabold text-sm shadow-md">
                  PATOLOGIA BUCAL
                </div>
              </div>
              <div data-brace-container class="flex items-stretch">
                <svg class="synoptic-brace-svg text-clinical-700 dark:text-cyan-300 mx-1.5"></svg>
                <div data-brace-content class="flex flex-col justify-center">
                  ${treeHTML}
                </div>
              </div>
            </div>
          </div>
        </div>`;

      requestAnimationFrame(drawSynopticCurlyBraces);
    }

    /* ==========================================================================
       14. MODO 8: GUÍA RÁPIDA DE APUNTES (BUSCADOR + GALERÍA VISUAL DUAL)
       ========================================================================== */
    function toggleGuideItem(id) {
      if (guideSession.openIds.includes(id)) guideSession.openIds = guideSession.openIds.filter(x => x !== id);
      else guideSession.openIds.push(id);
      renderGuide();
    }

    function toggleMasteredFromGuide(e, id) {
      e.stopPropagation();
      const p = PATHOLOGIES.find(x => x.id === id);
      if (appState.masteredIds.includes(id)) {
        appState.masteredIds = appState.masteredIds.filter(x => x !== id);
        saveState();
      } else {
        appState.masteredIds.push(id);
        addXP(10, `Dominado: ${p ? p.name : ""}`);
      }
      renderGuide();
    }

    function renderGuide() {
      const container = document.getElementById("view-container");
      const q = guideSession.search.trim().toLowerCase();

      const filtered = getFilteredPathologies().filter(p => {
        if (guideSession.alertFilter !== "all" && !p.alerts.includes(guideSession.alertFilter)) return false;
        if (!q) return true;
        return `${p.name} ${p.category} ${p.etiology} ${p.location} ${p.clinical} ${p.radiographic} ${p.treatment} ${p.examTip}`.toLowerCase().includes(q);
      });

      const itemsHTML = filtered.map(p => {
        const isOpen = guideSession.openIds.includes(p.id);
        const isMastered = appState.masteredIds.includes(p.id);
        const hasVisual = !!VISUAL_ASSETS[p.id];

        const badges = p.alerts.map(a => {
          if (a === "alta-recidiva") return `<span class="px-2 py-0.5 rounded-full bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 text-[11px] font-bold">⚠️ Alta recidiva</span>`;
          if (a === "maligno") return `<span class="px-2 py-0.5 rounded-full bg-rose-100 dark:bg-rose-950 text-rose-800 dark:text-rose-300 text-[11px] font-bold">🚨 Maligno</span>`;
          if (a === "signo-rx") return `<span class="px-2 py-0.5 rounded-full bg-cyan-100 dark:bg-cyan-950 text-cyan-800 dark:text-cyan-300 text-[11px] font-bold">🩻 Signo Rx</span>`;
          return "";
        }).join("");

        return `
          <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 overflow-hidden shadow-sm">
            <button onclick="toggleGuideItem(${p.id})" class="w-full text-left px-4 py-3.5 flex flex-wrap items-center justify-between gap-2 hover:bg-slate-50 dark:hover:bg-slate-800/60 transition">
              <div>
                <div class="font-extrabold text-sm sm:text-base text-slate-900 dark:text-white flex items-center gap-2">
                  <span>${p.id}. ${p.name}</span>
                  ${hasVisual ? '<span class="px-2 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300 text-[10px] font-bold">🖼️ Real + IA</span>' : ""}
                </div>
                <div class="text-xs text-slate-500 dark:text-slate-400 font-medium">${p.category}</div>
              </div>
              <div class="flex flex-wrap items-center gap-1.5">
                ${badges}
                <span onclick="toggleMasteredFromGuide(event, ${p.id})" class="px-2.5 py-1 rounded-full text-xs font-bold cursor-pointer ${isMastered ? 'bg-emerald-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">
                  ${isMastered ? "🎓 Dominado" : "☆ Marcar"}
                </span>
                <span class="text-xs font-bold text-slate-400 ml-1">${isOpen ? "▲" : "▼"}</span>
              </div>
            </button>

            ${isOpen ? `
              <div class="px-4 pb-4 pt-3 border-t border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-950/40 animate-fade-in">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5 text-xs">
                  <div class="p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800"><strong class="block text-clinical-600 dark:text-cyan-400 uppercase mb-0.5">🧬 Etiología / Histogénesis</strong>${p.etiology}</div>
                  <div class="p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800"><strong class="block text-clinical-600 dark:text-cyan-400 uppercase mb-0.5">📍 Localización</strong>${p.location}</div>
                  <div class="p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800"><strong class="block text-clinical-600 dark:text-cyan-400 uppercase mb-0.5">🩺 Características Clínicas</strong>${p.clinical}</div>
                  <div class="p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800"><strong class="block text-clinical-600 dark:text-cyan-400 uppercase mb-0.5">🩻 Radiografía / Imagen</strong>${p.radiographic}</div>
                  <div class="p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800"><strong class="block text-clinical-600 dark:text-cyan-400 uppercase mb-0.5">💊 Tratamiento y Recurrencia</strong>${p.treatment}</div>
                  <div class="p-3 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-300 dark:border-amber-800 text-amber-900 dark:text-amber-200"><strong class="block uppercase mb-0.5">💡 Perla de Examen</strong>${p.examTip}</div>
                </div>
                ${buildVisualGalleryHTML(p.id, "guide")}
              </div>
            ` : ""}
          </div>
        `;
      }).join("");

      const chips = [
        { id: "all", label: "Todas" },
        { id: "alta-recidiva", label: "⚠️ Alta recidiva" },
        { id: "maligno", label: "🚨 Maligno" },
        { id: "signo-rx", label: "🩻 Signo Rx" }
      ].map(c => `<button onclick="guideSession.alertFilter='${c.id}'; renderGuide();" class="px-3 py-1 rounded-full text-xs font-bold border transition ${guideSession.alertFilter === c.id ? 'bg-clinical-600 text-white border-clinical-600' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'}">${c.label}</button>`).join("");

      container.innerHTML = `
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <h2 class="text-lg font-extrabold">📚 Guía Rápida de Apuntes</h2>
            <span class="px-3 py-1 rounded-full bg-clinical-100 dark:bg-cyan-950 text-clinical-700 dark:text-cyan-300 text-xs font-bold">${filtered.length} patologías</span>
          </div>

          <div class="space-y-3 mb-5">
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">🔍</span>
              <input id="guide-search-input" type="text" value="${guideSession.search.replace(/"/g, "&quot;")}" placeholder="Buscar patología, signo Rx (pompas de jabón), síndrome (Gorlin, Sjögren), VPH, tratamiento..." class="w-full pl-10 pr-4 py-3 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm outline-none focus:border-clinical-600 transition" />
            </div>
            <div class="flex flex-wrap gap-2">${chips}</div>
          </div>

          <div class="space-y-2.5">
            ${itemsHTML || '<p class="text-center py-8 text-sm text-slate-400">No se encontraron coincidencias.</p>'}
          </div>
        </div>`;

      const input = document.getElementById("guide-search-input");
      if (input) {
        input.addEventListener("input", e => {
          guideSession.search = e.target.value;
          const pos = input.selectionStart;
          renderGuide();
          const fresh = document.getElementById("guide-search-input");
          if (fresh) { fresh.focus(); fresh.setSelectionRange(pos, pos); }
        });
      }
    }

    /* ==========================================================================
       15. INICIALIZACIÓN Y EVENTOS GLOBALES
       ========================================================================== */
    document.addEventListener("DOMContentLoaded", () => {
      loadState();
      renderUnitPills();
      switchTab(appState.activeTab);

      document.querySelectorAll(".mode-tab").forEach(btn => {
        btn.addEventListener("click", () => switchTab(btn.dataset.tab));
      });

      document.getElementById("btn-dark-mode").addEventListener("click", () => {
        appState.darkMode = !appState.darkMode;
        document.documentElement.classList.toggle("dark", appState.darkMode);
        saveState();
      });

      const resetModal = document.getElementById("reset-modal");
      document.getElementById("btn-reset-modal").addEventListener("click", () => {
        resetModal.classList.remove("hidden");
        resetModal.classList.add("flex");
      });
      document.getElementById("btn-cancel-reset").addEventListener("click", () => {
        resetModal.classList.add("hidden");
        resetModal.classList.remove("flex");
      });
      document.getElementById("btn-confirm-reset").addEventListener("click", () => {
        appState.xp = 0;
        appState.streak = 0;
        appState.masteredIds = [];
        appState.wrongQuestionIds = [];
        saveState();
        resetModal.classList.add("hidden");
        resetModal.classList.remove("flex");
        resetCurrentModeForFilter();
        showToast("Progreso reiniciado a cero", "clinical");
      });

      const visualModal = document.getElementById("visual-modal");
      document.getElementById("btn-close-visual-modal").addEventListener("click", () => {
        visualModal.classList.add("hidden");
        visualModal.classList.remove("flex");
      });
      visualModal.addEventListener("click", e => {
        if (e.target === visualModal) {
          visualModal.classList.add("hidden");
          visualModal.classList.remove("flex");
        }
      });

      window.addEventListener("resize", () => {
        if (appState.activeTab === "synoptic") drawSynopticCurlyBraces();
      });

      document.addEventListener("keydown", e => {
        if (appState.activeTab === "hangman" && hangmanSession.status === "playing") {
          if (document.activeElement && document.activeElement.tagName === "INPUT") return;
          if (/^[a-zA-ZñÑáéíóúÁÉÍÓÚ]$/.test(e.key)) guessHangmanLetter(e.key);
        }
      });
    });
  </script>
</body>
</html>
